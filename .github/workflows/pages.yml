name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/greenfield-project-igt3r3]
  workflow_dispatch:

# Permissions needed for the GitHub Actions Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Enables Pages on the repo automatically (enablement: true) so no manual
      # Settings toggle is required, and sets it to the GitHub Actions source.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The whole repo root is the static site (index.html lives at the root).
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
